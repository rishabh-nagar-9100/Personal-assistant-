services:
  # --------------------------------------------------
  # Backend Web Service (Spring Boot 3.3.5 / Java 21)
  # --------------------------------------------------
  - type: web
    name: jarvis-backend-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.1-8b-instant

  # --------------------------------------------------
  # Frontend Static Site (Vanilla JS Glassmorphism SPA)
  # --------------------------------------------------
  - type: static
    name: jarvis-frontend-app
    plan: free
    buildCommand: ""
    publishDir: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
